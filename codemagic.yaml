workflows:
  android-workflow:
    name: AutoClarity Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Extract AutoClarity project (if zipped)
        script: |
          if [ -f "AutoClarity-Romania-Android-Project.zip" ] && [ ! -f "settings.gradle" ]; then
            unzip -o AutoClarity-Romania-Android-Project.zip
          fi
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android APK
        script: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
            ./gradlew assembleDebug
          fi
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
